name: repo-size-watch

# 毎週、リポジトリ（GitHub上）のサイズを確認し、基準を超えたらIssueを作成して通知する。
# 夜間バッチが毎晩データをコミットするため履歴が増え続ける（1日あたり約12〜13MB）。
# 履歴の掃除（強制push）はPR参照が古い履歴を指し続けるためGitHub上の容量が減らない
# 可能性が高く採用しない。代わりに、UIが固まったら「データ専用ブランチを毎晩1コミットに
# 上書きする方式」へ移行する方針で、その移行時期を知らせるのが目的。
# 基準：2GBで警告、3GBで緊急。同じ内容のIssueが未解決のまま残っていれば重複作成しない。
# ※ gitへpushしないため、他のワークフローの排他制御グループには入れない。
on:
  schedule:
    - cron: "30 3 * * 1"   # 毎週月曜 03:30 UTC（12:30 JST）
  workflow_dispatch:
    inputs:
      test:
        description: "true にすると基準を0MBにして通知テストを行う"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: サイズ確認と通知
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST: ${{ github.event.inputs.test }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          size_kb=$(gh api "repos/${repo}" --jq .size)
          mb=$((size_kb / 1024))
          warn=2000
          crit=3000
          if [ "${TEST:-}" = "true" ]; then
            warn=0
            crit=100000
          fi
          echo "現在のサイズ: ${mb}MB（警告 ${warn}MB／緊急 ${crit}MB）"

          if [ "$mb" -ge "$crit" ]; then
            level="緊急"; th="$crit"
          elif [ "$mb" -ge "$warn" ]; then
            level="警告"; th="$warn"
          else
            echo "基準未満のため通知しません"
            exit 0
          fi

          title="【容量${level}】リポジトリ容量が${th}MBを超えました"
          if [ "${TEST:-}" = "true" ]; then
            title="【テスト】${title}"
          fi

          exists=$(gh issue list --repo "$repo" --state open --search "in:title \"${title}\"" --json number --jq 'length')
          if [ "$exists" -gt 0 ]; then
            echo "同じ内容のIssueが未解決のため、重複作成しません"
            exit 0
          fi

          cat > /tmp/body.md <<EOF
          @notenki0909-hub

          リポジトリ（GitHub上）のサイズが **${mb}MB** になり、${level}の基準（${th}MB）を超えました。

          - 夜間バッチが毎晩データをコミットするため、履歴が1日あたり約12〜13MBずつ増えています。
          - 目安：GitHub の推奨サイズは1GB、数GB規模（5GB前後）から支障が出る可能性があります。
          - 対応：Claude（配当株ツールのセッション）に「データ専用ブランチ方式（3番）への
            移行を進めて」と伝えてください。サイトの内容を専用ブランチに置き、毎晩1コミットに
            上書きすることで、履歴の増加をほぼ止める方式です。10年保有側の
            ワークフローも含めた調整が必要になります。

          このIssueは対応が終わったら閉じてください（閉じるまでは重複して作成されません）。
          EOF
          gh issue create --repo "$repo" --title "$title" --body-file /tmp/body.md
