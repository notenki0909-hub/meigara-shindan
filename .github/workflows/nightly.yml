name: nightly-refresh

# 毎晩ユニバース全銘柄の株価・スコアを更新してランキングを作り直す。
# --only-stale --hours 20 なので、前回成功から20時間経っていない銘柄はスキップ
# （1日1回のcronなら実質「毎晩フル更新」になる）。
on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 03:00 JST（翌営業日の朝までに間に合わせる）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: meigara-dividend-git-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Yahoo取得結果の共有キャッシュ（10年保有側の nightly-long が同じ銘柄を再取得しないため。yf_cache.py）
      YF_CACHE_DIR: ${{ github.workspace }}/.yf_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: バッチ診断（古い銘柄のみ再取得）
        run: python batch.py --codes universe.json --with-retired --with-kouza --only-stale --hours 20 --sleep 2.0

      - name: 取得結果の共有キャッシュを保存（10年保有側が再利用する）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .yf_cache
          key: yf-jp-${{ github.run_id }}
      - name: ランキング再生成
        run: python rank.py

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ universe.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(nightly): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "::error::pushが${n}回失敗しました"
              exit 1
            fi
            echo "pushが拒否されました。取り込んで再試行します（${n}/5）"
            sleep $((RANDOM % 10 + 5))
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::rebaseで競合が発生しました"
              git rebase --abort
              exit 1
            fi
          done
