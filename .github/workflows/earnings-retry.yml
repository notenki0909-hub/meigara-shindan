name: earnings-retry

# 6時間おきに pending_earnings.json の期限到来分を再取得し、yfinance側に
# 決算実績が反映されたか確認する（tdnet-watch.yml が検知した銘柄が対象）。
on:
  schedule:
    - cron: "15 */6 * * *"   # 毎時ちょうどの混雑を避けて15分ずらし
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: earnings-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: 反映確認・再取得
        run: python earnings_retry.py --sleep 2.0

      - name: ランキング再生成（反映があった場合のみ意味を持つが軽いので毎回実行）
        run: python rank.py

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_earnings.json site/
          git diff --cached --quiet || git commit -m "chore(earnings): retry $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
