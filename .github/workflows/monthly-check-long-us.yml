name: monthly-check-long-us

# 『10年保有できる優良企業』米国版の月次軽量チェック。S&P500の構成銘柄入れ替えは
# 不定期（M&A・破産等のたびに随時）に起きるため、四半期に1回の見直し
# （universe-long-quarterly.yml）を待たずに追従する。
# 新規追加銘柄を universe_long_us.json に追加し、除外銘柄は universe_long_us.json からは
# 削除せず universe_long_watch_us.json に記録するだけ（rank_long.py が「対象外」として表示する）。
# 四半期の見直しが来るとそちらが正式なリストになる。
#
# 配当株ツール（build_universe_us.py の screen/all サブコマンド、universe_us.json、
# batch_us.py、rank_us.py）には一切触れない。
#
# 【自動反映】（2026-10-05に、人がPRを確認してからマージする方式から変更）
#   母集団ファイル（universe_long_us.json・universe_long_watch_us.json）だけを、安全確認
#   （universe_guard.py）を通ったときに直接 main へコミットする。
#   ・診断結果・ランキング（site/ 配下）はコミットしない。夜間の nightly-long-us が新しく入った
#     銘柄も診断してランキングを作り直すため（夜間更新と同じファイルを書き換えず競合しない）。
#   ・異常（銘柄数の大きな増減など）はIssueで通知して自動反映を見送る。手動実行で force を true に
#     すると反映できる。追加・除外の一覧はコミットメッセージと実行結果（Summary）に残る。
on:
  schedule:
    - cron: "0 6 1 * *"   # 毎月1日 6:00 UTC（15:00 JST。夜間更新の時間帯を避ける）
  workflow_dispatch:
    inputs:
      force:
        description: "true にすると安全確認の異常を無視して反映する（内容を確認した場合のみ）"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-check-long-us
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: S&P500入れ替えチェック（新規銘柄のみ診断・除外銘柄は暫定フラグ）
        run: python monthly_check_long_us.py

      - name: 安全確認（銘柄数・追加の件数）
        id: guard
        continue-on-error: true
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "${FORCE:-false}" = "true" ]; then
            python universe_guard.py us --force --title "月次S&P500チェック（手動force）"
          else
            python universe_guard.py us --title "月次S&P500チェック"
          fi

      - name: 実行結果に追加・除外の一覧を表示
        if: always()
        run: |
          if [ -f universe_change.md ]; then cat universe_change.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: コミット（母集団ファイルのみ）
        if: steps.guard.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in universe_long_us.json universe_long_watch_us.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -F universe_commit_msg.txt
          # 診断結果・ランキングなど、コミット対象外の変更は破棄する（rebaseで取り込めるようにするため。実行環境は使い捨て）
          git reset --hard HEAD
          git clean -fdq
          # push拒否（mainが進んでいた）時は、取り込んで最大5回やり直す。
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "::error::pushが${n}回失敗しました"
              exit 1
            fi
            echo "pushが拒否されました。取り込んで再試行します（${n}/5）"
            sleep $((RANDOM % 10 + 5))
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::rebaseで競合が発生しました"
              git rebase --abort
              exit 1
            fi
          done

      - name: 異常を検出したためIssueで通知
        if: steps.guard.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          title="【母集団】月次S&P500チェックで異常を検出したため自動反映を見送りました"
          exists=$(gh issue list --repo "$repo" --state open --search "in:title \"${title}\"" --json number --jq 'length')
          if [ "$exists" -gt 0 ]; then
            echo "同じ内容のIssueが未解決のため、重複作成しません"
            exit 0
          fi
          {
            echo "@notenki0909-hub"
            echo
            echo "10年保有ランキング（米国株）の月次S&P500チェックで、銘柄数や追加の件数が通常の範囲を超えたため、"
            echo "自動反映を見送りました（母集団ファイルは更新していません）。"
            echo
            cat universe_change.md
            echo
            echo "- 実行結果：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- 想定される原因：Wikipediaの表の形式変更や取得失敗、または実際の大きな入れ替え。"
            echo "- 対応：Claude（10年保有側のセッション）に「月次チェックの異常を調べて」と伝えてください。"
            echo "  内容に問題がなければ、Actions の monthly-check-long-us で Run workflow を選び force を true にして"
            echo "  手動実行すると反映できます。"
            echo
            echo "このIssueは対応が終わったら閉じてください（閉じるまでは重複して作成されません）。"
          } > /tmp/body.md
          gh issue create --repo "$repo" --title "$title" --body-file /tmp/body.md

      - name: 異常を実行結果にも反映
        if: steps.guard.outcome == 'failure'
        run: |
          echo "::error::母集団の安全確認で異常を検出したため、自動反映を見送りました（Issueを確認してください）"
          exit 1
