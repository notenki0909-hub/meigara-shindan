name: nightly-refresh-us

# 毎晩、米国株ユニバース全銘柄の株価・スコアを更新してランキングを作り直す。
# NYSE の引け（日本時間 朝5〜6時）後に回す。日本株の nightly（18:00 UTC = 03:00 JST）
# とはアクセスが重ならないよう 22:00 UTC（= 翌 07:00 JST）に分けている。
# --only-stale --hours 20 なので 1日1回の cron なら実質「毎晩フル更新」。
on:
  # 取得専用の工程（fetch-data-us）が終わったら動く。取得が失敗・一部失敗でも動く（取れなかった銘柄はここで従来どおり自分で取得する）。
  # 手動実行（workflow_dispatch）のときは、直近に成功した取得結果（20〜30時間以内）があれば使う。
  workflow_run:
    workflows: ["fetch-data-us"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read   # 取得結果（artifact）の取得

concurrency:
  group: meigara-dividend-git-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 取得専用の工程が保存した取得結果を読む（yf_cache.py）。無い・古い銘柄は、従来どおりここで取得する。
      YF_CACHE_DIR: ${{ github.workspace }}/.yf_cache
      YF_CACHE_READONLY: "1"
      YF_CACHE_MAX_AGE_HOURS: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: 取得結果を復元（fetch-data-us が保存したもの）
        uses: ./.github/actions/get-yf-store
        with:
          market: us
          token: ${{ github.token }}

      - name: バッチ診断（古い銘柄のみ再取得）
        run: python batch_us.py --codes universe_us.json --with-retired --only-stale --hours 20 --sleep 2.0

      - name: ランキング再生成
        run: python rank_us.py

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/us universe_us.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(nightly-us): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "::error::pushが${n}回失敗しました"
              exit 1
            fi
            echo "pushが拒否されました。取り込んで再試行します（${n}/5）"
            sleep $((RANDOM % 10 + 5))
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::rebaseで競合が発生しました"
              git rebase --abort
              exit 1
            fi
          done
