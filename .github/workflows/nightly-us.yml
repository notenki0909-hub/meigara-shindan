name: nightly-refresh-us

# 毎晩、米国株ユニバース全銘柄の株価・スコアを更新してランキングを作り直す。
# NYSE の引け（日本時間 朝5〜6時）後に回す。日本株の nightly（18:00 UTC = 03:00 JST）
# とはアクセスが重ならないよう 22:00 UTC（= 翌 07:00 JST）に分けている。
# --only-stale --hours 20 なので 1日1回の cron なら実質「毎晩フル更新」。
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 07:00 JST（NYSE 引け後・JP nightly と非重複）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-refresh-us
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: バッチ診断（古い銘柄のみ再取得）
        run: python batch_us.py --codes universe_us.json --only-stale --hours 20 --sleep 2.0

      - name: ランキング再生成
        run: python rank_us.py

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/us universe_us.json
          git diff --cached --quiet || git commit -m "chore(nightly-us): refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
