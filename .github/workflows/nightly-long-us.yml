name: nightly-long-us

# 『10年保有できる優良企業ランキング（米国株・配当抜き品質スコア）』の毎晩更新。
# 既存の nightly-refresh-us（配当株）とは別ジョブ。site/us/long/ 以下しか触らない。
# nightly-refresh-us の完了後に走らせて site/us/summaries/ の最新結果を流用する。
on:
  workflow_run:
    workflows: ["nightly-refresh-us"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-long-us
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: S&P500 のうち配当株バッチ外の銘柄だけ診断（古いものだけ）
        run: python batch_long.py us --only-stale --hours 20 --sleep 2.0

      - name: 10年保有ランキング再生成
        run: python rank_long.py us

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/us/long site/us/long_summaries universe_long_us.json
          git diff --cached --quiet || git commit -m "chore(nightly-long-us): refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
